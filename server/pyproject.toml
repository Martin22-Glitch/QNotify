[project]
name = "qnotify-server"
version = "0.1.0"
description = "QQ 重要信息通知管理器 - 常驻核心服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "websockets>=13.1,<15",
    "tzdata>=2026.6",
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<1.0",
]


[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008：FastAPI 的规范写法就是 `db: X = Depends(get_db)`，与 B008 冲突，忽略
ignore = ["E501", "B008"]
